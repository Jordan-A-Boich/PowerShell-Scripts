name: Wire Up CDC
description: Post-migration CDC wiring for side-by-side migrated databases - recreates the msdb pieces the migration left behind (cdc_jobs table/view, capture and cleanup Agent jobs) for databases that arrived with CDC metadata and tracked tables intact. Replication-aware (published databases get cleanup only - the Log Reader Agent captures) and AG-aware (guard steps plus full synchronization to every secondary replica).
kind: script
promptBased: true
parameters:
  - name: DBA_SERVERS
    description: Optional environment variable. Pre-fills the server name prompt (first entry when semicolon-separated). Connect to the PRIMARY replica for AG databases.
  - name: DBA_USERNAME
    description: Optional environment variable. SQL login to use instead of the login prompt; leave unset for Windows authentication or interactive prompts.
  - name: DBA_PASSWORD
    description: Optional environment variable. Password for DBA_USERNAME; only read when DBA_USERNAME is set.
exampleOutput: |
