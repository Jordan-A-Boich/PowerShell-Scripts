name: Sync CDC Tracked Columns
description: Finds tables whose columns changed after CDC was enabled (new columns silently untracked, dropped columns still captured) and hot-swaps the capture instance to match while preserving recent change data.
kind: script
promptBased: true
parameters:
  - name: DBA_SERVERS
    description: Optional environment variable. Pre-fills the server name prompt (first entry when semicolon-separated).
  - name: DBA_USERNAME
    description: Optional environment variable. SQL login to use instead of the login prompt; leave unset for Windows authentication or interactive prompts.
  - name: DBA_PASSWORD
    description: Optional environment variable. Password for DBA_USERNAME; only read when DBA_USERNAME is set.
exampleOutput: |
  === Sync CDC Tracked Columns ===

  Server name: SQLLAB-SQL1
    [OK]   Connected to SQLLAB-SQL1 (SQL Server 17.0.4006.2, Enterprise Developer Edition (64-bit))

  CDC-enabled databases:
     1. Sales [AG: SQLLabAG]

  Select database(s) to analyze (e.g. 1,3): 1

  --- Sales ---
  Tables with column drift:
     1. dbo.Orders - untracked column(s): Discount
     2. dbo.Items - dropped column(s) still captured: LegacyCode
    [..]   In sync: dbo.Customers

  Select table(s) to sync ('all' for every table, Enter to skip): all
  Hours of change history to preserve [3]:
    [WARN] Each selected table's capture instance will be recreated via a temporary '_New' instance. Change data from the last 3 hour(s) is carried over; OLDER change rows are NOT. Three 20-second safety delays run per table.
  Continue (y/N): y

    [..]   Syncing dbo.Orders...
    [OK]   temporary capture instance 'dbo_Orders_New' created
    [OK]   42 change row(s) from the last 3 hour(s) copied to 'dbo_Orders_New'
    [OK]   original capture instance 'dbo_Orders' dropped
    [OK]   capture instance 'dbo_Orders' recreated with the current column list
    [OK]   42 change row(s) carried into the recreated 'dbo_Orders'
    [OK]   temporary capture instance 'dbo_Orders_New' removed
    [OK]   Re-check clean - all tracked tables now match their capture instances.

  Summary:
    Sales - synced 1 table(s)
steps:
  - name: script
    file: sync-cdctrackedcolumns.ps1
